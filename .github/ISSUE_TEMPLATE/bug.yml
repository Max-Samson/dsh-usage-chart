name: Bug report
description: Report a reproducible problem in dsh-usage-chart
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private session content, or unredacted account screenshots.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin, DSH, Node.js, browser, and operating-system versions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: shell
